worker_processes 1;
pid /tmp/qwen/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    client_body_temp_path /tmp/qwen/client_body;
    proxy_temp_path /tmp/qwen/proxy;
    fastcgi_temp_path /tmp/qwen/fastcgi;
    uwsgi_temp_path /tmp/qwen/uwsgi;
    scgi_temp_path /tmp/qwen/scgi;
    sendfile on;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    include /tmp/qwen/http.conf;
    include /etc/qwen-image-studio/server.conf;
}
