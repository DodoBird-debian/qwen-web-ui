server {
    listen 8080;
    server_name _;
    root /opt/qwen-image-studio/current;
    index index.html;
    client_max_body_size 10000000;
    client_body_timeout 60s;
    send_timeout 90s;
    server_tokens off;

    # Optional site auth belongs here; keep it separate from the RunPod key.
    include /etc/qwen-image-studio/site-auth.conf;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;

    location = /healthz {
        auth_basic off;
        default_type text/plain;
        return 200 'ok\n';
    }
    location ~ ^/api/runpod/[A-Za-z0-9_-]+/(run|health|status/[A-Za-z0-9_-]+|cancel/[A-Za-z0-9_-]+)$ {
        if ($qwen_route_allowed = 0) { return 405; }
        if ($qwen_runpod_key = '') { return 401; }
        # A fixed host in a variable permits DNS refresh on distribution nginx.
        set $qwen_runpod_host api.runpod.ai;
        rewrite ^/api/runpod/(.*)$ /v2/$1 break;
        proxy_pass https://$qwen_runpod_host$uri;
        proxy_http_version 1.1;
        proxy_pass_request_headers off;
        proxy_set_header Host api.runpod.ai;
        proxy_set_header Authorization "Bearer $qwen_runpod_key";
        proxy_set_header Content-Type application/json;
        proxy_set_header Connection '';
        proxy_ssl_server_name on;
        proxy_ssl_name api.runpod.ai;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_ssl_verify_depth 5;
        proxy_connect_timeout 15s;
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
        proxy_next_upstream off;
        proxy_cache off;
        proxy_buffering off;
        proxy_hide_header Access-Control-Allow-Origin;
        # Do not record upstream job requests or their keys/bodies.
        access_log off;
    }
    location /api/ { return 404; }
    location = /config.json { expires -1; }
    location /assets/ { expires 1y; try_files $uri =404; }
    location / { try_files $uri $uri/ /index.html; }
}
